<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; padding: 30px; font-family: var(--vscode-font-family);
      color: var(--vscode-foreground); background: var(--vscode-editor-background);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    p { color: var(--vscode-descriptionForeground); font-size: 13px; margin: 0 0 20px; max-width: 400px; }
    .steps { text-align: left; font-size: 12px; color: var(--vscode-descriptionForeground); margin: 0 0 24px; line-height: 1.8; }
    .btn { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; margin: 4px; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--vscode-button-background); color: var(--vscode-button-foreground); }
  </style>
</head>
<body>
  <div class="icon">🔐</div>
  <h2>登录 <span id="platform-name">平台</span></h2>
  <p>由于安全策略，无法在面板内嵌入登录页。请在浏览器中完成登录。</p>
  <div class="steps">
    1. 点击下方"打开登录页"按钮<br>
    2. 在浏览器中完成登录<br>
    3. F12 打开 Console，运行 <code>copy(document.cookie)</code><br>
    4. 回到这里点击"粘贴 Cookie"
  </div>
  <div>
    <button class="btn" id="openBtn">打开登录页</button>
    <button class="btn btn-secondary" id="pasteBtn">粘贴 Cookie</button>
  </div>
  <script>
    var vscode = acquireVsCodeApi();
    var platform = '{{PLATFORM}}';
    var LOGIN_URLS = {
      netease: 'https://music.163.com/login',
      qq: 'https://y.qq.com',
      kugou: 'https://www.kugou.com',
      bilibili: 'https://passport.bilibili.com/login'
    };
    document.getElementById('platform-name').textContent = platform;
    document.getElementById('openBtn').onclick = function () {
      vscode.postMessage({ type: 'login:openUrl', url: LOGIN_URLS[platform], platform: platform });
    };
    document.getElementById('pasteBtn').onclick = function () {
      vscode.postMessage({ type: 'login:paste', platform: platform });
    };
  </script>
</body>
</html>
